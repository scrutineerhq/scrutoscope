name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  validate:
    name: Validate release (PHPCS + tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          tools: composer

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run PHPCS
        run: composer lint

      - name: Syntax check
        run: find . -name '*.php' -not -path './vendor/*' | xargs -n1 php -l

      - name: Run PHPUnit
        run: composer test

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Validate share format
        run: node tests/validate-share-format.js

  build:
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4

      - name: Build distribution zip
        run: |
          mkdir -p /tmp/scrutoscope-build/scrutoscope
          rsync -a --exclude-from=.distignore . /tmp/scrutoscope-build/scrutoscope/
          cd /tmp/scrutoscope-build
          zip -r scrutoscope.zip scrutoscope/ -q

      - name: Create release with zip
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          gh release create "$TAG" /tmp/scrutoscope-build/scrutoscope.zip \
            --title "$TAG" \
            --generate-notes \
            --latest

  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Deploy to WordPress.org
        uses: 10up/action-wordpress-plugin-deploy@stable
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: scrutoscope
